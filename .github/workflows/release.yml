name: release

# A tag is the only thing that produces a release. `make release` builds and
# verifies the same artifacts locally, so a maintainer can prove a tag will work
# before pushing it.
on:
  # Tag pushes only. A branch push never publishes: the tag is the release.
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The gate the release cannot ship without: the tree at the tag must pass the
  # same tests a contributor's pull request passes.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: |
          make fixtures
          git diff --exit-code testdata/fixtures
      - run: |
          make rules-doc
          git diff --exit-code docs/rules.md

  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build and verify
        # VERSION is the tag (git describe reads it), so the binary's report and
        # the release's name are one value.
        run: |
          make release-binaries
          sh tools/release/verify.sh dist "$(git describe --tags)"

      # Idempotent on purpose: re-pointing a tag is legitimate (a docs-only fix
      # should not need a new version), and `gh release create` fails when the
      # release already exists. Create when absent, upload with --clobber when not,
      # so a re-run replaces the assets instead of dying halfway.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag containing "-" is a pre-release (v1.0.1-rc1). It must be marked
          # as one, or the release page advertises an unfinished build as the
          # current version.
          case "$GITHUB_REF_NAME" in
            *-*) release_flags="--prerelease" ;;
            *)   release_flags="" ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/sc4n_* dist/SHA256SUMS --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" \
              --title "sc4n $GITHUB_REF_NAME" \
              --generate-notes $release_flags \
              dist/sc4n_* dist/SHA256SUMS
          fi
