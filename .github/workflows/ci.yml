name: ci

on:
  # Branches only: a tag push is the release workflow's job, and running this twice
  # for one commit (branch + tag) doubles the queue for no result.
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # vet + test + test -race, the same gate the Makefile runs locally.
      - name: test
        run: make test

      # The committed fixture corpus is generated. A diff here means the
      # generator and the corpus disagree, which the corpus test cannot see
      # because it scans what is on disk.
      - name: fixtures are generated, not hand-edited
        run: |
          make fixtures
          git diff --exit-code testdata/fixtures

      - name: documentation links
        run: make docs-links

      # docs/rules.md is generated from the registry, and every rule must carry a
      # triage bucket (tools/sc4nrules). A diff means the page a reader looks a
      # finding up in disagrees with the code that emitted it.
      - name: rule catalogue is generated
        run: |
          make rules-doc
          git diff --exit-code docs/rules.md

      # The scan path is stdlib-only by design; these are the other release
      # targets a user may build for.
      - name: cross-build
        run: |
          for target in linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -o /dev/null ./cmd/sc4n
          done

      # The gates the release gate needs, against the binary a user downloads.
      # They used to run inside a Docker image; building that image on every push
      # was work nobody asked for, so the same two scans run on the binary.
      - name: build the CLI
        run: go build -trimpath -o sc4n ./cmd/sc4n

      - name: a benign tree scans clean
        run: ./sc4n scan -fail-on low testdata/fixtures/benign

      - name: a critical finding fails the run
        run: |
          set +e
          ./sc4n scan -fail-on critical testdata/fixtures/joblib_object_array.joblib 2>/dev/null
          status=$?
          set -e
          test "$status" -eq 1

  sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The SARIF must satisfy the format's schema, not just the fields GitHub
      # documents: a consumer that parses it strictly fails on either.
      - name: sarif schema
        run: |
          python3 -m pip install --quiet jsonschema==4.19.2
          make sarif-check

