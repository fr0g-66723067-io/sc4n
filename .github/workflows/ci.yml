name: ci

on:
  # Branches only: a tag push is the release workflow's job, and running this twice
  # for one commit (branch + tag) doubles the queue for no result.
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # vet + test + test -race, docs links, and the generated-fixture/rule-diff
      # gates: the same gate a tag must pass.
      - name: release gate
        run: make release-gate

      # Prove the tree still builds and passes under GOEXPERIMENT=simd and its
      # emulated portable path (GODEBUG=simd=0).
      - name: simd gate
        run: make test-simd

      # The scan path is stdlib-only by design; these are the other release
      # targets a user may build for.
      - name: cross-build
        run: |
          for target in linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -o /dev/null ./cmd/sc4n
          done

      # The gates the release gate needs, against the binary a user downloads.
      - name: build the CLI
        run: go build -trimpath -o sc4n ./cmd/sc4n

      - name: a benign tree scans clean
        run: ./sc4n scan -fail-on low testdata/fixtures/benign

      - name: a critical finding fails the run
        run: |
          set +e
          ./sc4n scan -fail-on critical testdata/fixtures/joblib_object_array.joblib 2>/dev/null
          status=$?
          set -e
          test "$status" -eq 1

  sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # The SARIF must satisfy the format's schema, not just the fields GitHub
      # documents: a consumer that parses it strictly fails on either.
      - name: sarif schema
        run: |
          python3 -m pip install --quiet jsonschema==4.19.2
          make sarif-check
